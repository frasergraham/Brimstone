<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brimstone — Spectator</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Spectator-specific overrides */
    body { overflow: hidden; }
    #setup-screen { display: none !important; }
    #game-screen  { display: flex !important; }
    #end-turn-btn, #plan-panel, #cancel-wrap, #inventory-btn { display: none !important; }
    #game-over { display: none; }

    /* Player ready panel (right side during planning) */
    #sp-ready-panel {
      width: 180px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sp-ready-header {
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #sp-ready-list {
      padding: 0.4rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sp-ready-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      padding: 3px 4px;
      border-radius: 3px;
    }
    .sp-ready-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-dim);
    }
    .sp-ready-dot.submitted { background: var(--green); }
    .sp-ready-name { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-ready-faction-hero  { color: var(--hero); }
    .sp-ready-faction-witch { color: var(--witch); }

    .spectator-banner {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 15, 22, 0.85);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      pointer-events: none;
      letter-spacing: 0.08em;
    }
    .spectator-banner .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 0.4rem;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .spectator-info {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 15, 22, 0.9);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .spectator-info .faction-hero  { color: var(--hero); }
    .spectator-info .faction-witch { color: var(--witch); }
    .spectator-info .round-info    { color: var(--text-dim); }

    #spectate-status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-dim);
      font-size: 1.2rem;
      font-style: italic;
      z-index: 999;
    }

    /* Game-over overlay for spectators */
    #spectate-game-over {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1001;
      background: rgba(13, 15, 22, 0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }
    #spectate-game-over h2 {
      font-size: 1.8rem;
      color: var(--day);
      margin-bottom: 0.5rem;
    }
    #spectate-game-over p {
      color: var(--text);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Reuse the game screen structure from index.html (subset needed for rendering) -->
  <div id="setup-screen"></div>
  <div id="game-screen">
    <header id="game-header">
      <span class="header-title">BRIMSTONE</span>
      <div id="online-status" style="display:none"></div>
      <div id="turn-info"></div>
      <button id="end-turn-btn" style="display:none"></button>
      <div id="node-status"></div>
      <button id="inventory-btn" style="display:none"></button>
      <button id="chronicle-btn" class="header-icon-btn" title="Chronicle">📜</button>
      <span id="game-version" class="game-version"></span>
    </header>
    <div id="cycle-bar"><div id="node-status-bar"></div></div>

    <main id="game-main">
      <!-- Chronicle sidebar: left panel shown in 'full' chronicle mode -->
      <div id="chronicle-sidebar" style="display:none">
        <div class="chronicle-sidebar-header">
          <span class="chronicle-title">📜 Chronicle</span>
          <button id="chronicle-sidebar-close" title="Close chronicle">✕</button>
        </div>
        <div id="chronicle-sidebar-log"></div>
      </div>
      <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="unit-stats-bar" style="display:none"></div>
        <div id="zoom-controls" class="zoom-controls">
          <button id="zoom-in"  class="zoom-btn" title="Zoom in">+</button>
          <button id="zoom-out" class="zoom-btn" title="Zoom out">-</button>
          <button id="zoom-fit" class="zoom-btn" title="Fit map">F</button>
        </div>
        <div id="chronicle-mini"></div>
      </div>

      <!-- Player ready list shown during planning phase -->
      <div id="sp-ready-panel" style="display:none">
        <div class="sp-ready-header">📋 Planning</div>
        <div id="sp-ready-list"></div>
      </div>

      <div id="plan-panel" style="display:none"></div>
    </main>

    <div id="cancel-wrap" style="display:none"></div>
  </div>

  <!-- Chronicle overlay -->
  <div id="chronicle-overlay">
    <div id="chronicle-panel">
      <div class="chronicle-header">
        <span class="chronicle-title">📜 Chronicle</span>
        <button id="chronicle-close">X</button>
      </div>
      <div id="event-log"></div>
    </div>
  </div>

  <!-- Dialogs needed by renderer (stubs) -->
  <div id="inventory-overlay" style="display:none"></div>
  <div id="tile-zoom-overlay" style="display:none"></div>
  <div id="action-popup" style="display:none"></div>
  <div id="encounter-dialog" style="display:none"></div>
  <div id="battle-toast-container" class="battle-toast-container"></div>
  <div id="result-dialog" style="display:none"></div>
  <div id="battle-dialog" style="display:none"></div>
  <div id="game-over" style="display:none"></div>
  <div id="speed-toggle" style="display:none"></div>

  <!-- Spectator UI -->
  <div class="spectator-banner">
    <span class="live-dot"></span>SPECTATING
  </div>

  <div class="spectator-info" id="spectator-info" style="display:none">
    <span class="faction-hero" id="sp-hero">-</span>
    <span class="round-info" id="sp-round">-</span>
    <span class="faction-witch" id="sp-witch">-</span>
  </div>

  <div id="spectate-status">Connecting...</div>

  <div id="spectate-game-over">
    <h2 id="sp-winner-text"></h2>
    <p id="sp-win-reason"></p>
  </div>

  <script type="module">
    import { Renderer }      from './src/renderer.js';
    import { MirrorState }   from './src/multiplayer.js';
    import { VERSION }       from './src/version.js';
    import { UIController }  from './src/ui.js';

    const versionEl = document.getElementById('game-version');
    if (versionEl) versionEl.textContent = `v${VERSION}`;

    const params   = new URLSearchParams(window.location.search);
    const roomId   = params.get('room');
    const statusEl = document.getElementById('spectate-status');

    if (!roomId) {
      statusEl.textContent = 'No room specified. Use ?room=<roomId>';
    } else {
      connectSpectator(roomId);
    }

    let ui = null;
    let planningPlayers = [];   // [{playerId, name, faction, isAI}]
    let submittedIds    = new Set();

    function connectSpectator(roomId) {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);

      ws.addEventListener('open', () => {
        statusEl.textContent = 'Joining room...';
        ws.send(JSON.stringify({ type: 'adminSpectateRoom', roomId }));
      });

      ws.addEventListener('message', (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        statusEl.textContent = 'Disconnected.';
        statusEl.style.display = '';
      });

      ws.addEventListener('error', () => {
        statusEl.textContent = 'Connection error.';
      });
    }

    function handleMessage(msg) {
      switch (msg.type) {
        case 'adminSpectateInit': {
          statusEl.style.display = 'none';
          document.getElementById('spectator-info').style.display = '';
          const state = MirrorState.fromSnapshot(msg.state);
          state.fogOfWar = false;
          initUI(state);
          updateInfoBar(msg.players, state);
          break;
        }

        case 'stateUpdate': {
          const state = MirrorState.fromSnapshot(msg.state);
          state.fogOfWar = false;
          ui?.updateState(state);
          updateRoundLabel(state);
          checkGameOver(state);
          break;
        }

        case 'resolutionComplete': {
          const state = MirrorState.fromSnapshot(msg.finalState);
          state.fogOfWar = false;
          ui?.updateState(state);
          updateRoundLabel(state);
          checkGameOver(state);
          planningPlayers = [];
          submittedIds = new Set();
          renderReadyList();
          break;
        }

        case 'adminPlanningPhase': {
          document.getElementById('sp-round').textContent = `Round ${msg.round} — ${msg.phase}`;
          if (msg.players) {
            planningPlayers = msg.players;
            submittedIds = new Set();
            renderReadyList();
          }
          break;
        }

        case 'playerSubmitted': {
          submittedIds.add(msg.playerId);
          renderReadyList();
          break;
        }

        case 'resolutionStart': {
          planningPlayers = [];
          submittedIds = new Set();
          renderReadyList();
          break;
        }

        case 'adminRoomEnded': {
          statusEl.textContent = 'Game ended.';
          statusEl.style.display = '';
          break;
        }

        case 'error': {
          statusEl.textContent = msg.message || 'Error';
          statusEl.style.display = '';
          break;
        }
      }
    }

    function initUI(state) {
      const canvas   = document.getElementById('game-canvas');
      const renderer = new Renderer(canvas, state);
      renderer.resize();
      renderer.loadImages();

      const redraw = () => renderer.draw();
      ui = new UIController(canvas, state, renderer, null, redraw, null, false);
      ui.spectator = true;

      window.addEventListener('resize', () => {
        renderer.resize();
        renderer.draw();
      });

      renderer.draw();
    }

    function updateInfoBar(players, state) {
      if (players) {
        const heroNames  = players.filter(p => p.faction === 'hero').map(p => p.name).join(', ');
        const witchNames = players.filter(p => p.faction === 'witch').map(p => p.name).join(', ');
        document.getElementById('sp-hero').textContent  = `⚔ ${heroNames  || 'Hero'}`;
        document.getElementById('sp-witch').textContent = `✦ ${witchNames || 'Witch'}`;
      }
      updateRoundLabel(state);
    }

    function updateRoundLabel(state) {
      document.getElementById('sp-round').textContent = `Round ${state.round} — ${state.phase}`;
    }

    function checkGameOver(state) {
      if (!state.gameOver) return;
      const goEl = document.getElementById('spectate-game-over');
      const winText   = document.getElementById('sp-winner-text');
      const reasonEl  = document.getElementById('sp-win-reason');
      winText.textContent = state.winner === 'hero' ? 'Hero Wins!' : 'Witch Wins!';
      winText.style.color = state.winner === 'hero' ? 'var(--hero)' : 'var(--witch)';
      reasonEl.textContent = state.winReason || '';
      goEl.style.display = '';
    }

    function renderReadyList() {
      const panel = document.getElementById('sp-ready-panel');
      const list  = document.getElementById('sp-ready-list');
      if (!panel || !list) return;
      if (planningPlayers.length === 0) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'flex';
      list.innerHTML = planningPlayers.map(p => {
        const submitted  = submittedIds.has(p.playerId);
        const fCls       = `sp-ready-faction-${p.faction}`;
        const dotCls     = submitted ? 'sp-ready-dot submitted' : 'sp-ready-dot';
        const status     = submitted ? '✓' : '…';
        const safeName   = String(p.name).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<div class="sp-ready-row">
          <span class="${dotCls}"></span>
          <span class="sp-ready-name ${fCls}" title="${safeName}">${safeName}</span>
          <span style="font-size:0.72rem;color:${submitted ? 'var(--green)' : 'var(--text-dim)'}">${status}</span>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
