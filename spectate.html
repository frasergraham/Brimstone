<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brimstone — Spectator</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Spectator-specific overrides */
    body { overflow: hidden; }
    #setup-screen { display: none !important; }
    #game-screen  { display: flex !important; }
    #end-turn-btn, #plan-panel, #cancel-wrap, #inventory-btn { display: none !important; }
    #game-over { display: none; }

    .spectator-banner {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 15, 22, 0.85);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      pointer-events: none;
      letter-spacing: 0.08em;
    }
    .spectator-banner .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 0.4rem;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .spectator-info {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(13, 15, 22, 0.9);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }
    .spectator-info .faction-hero  { color: var(--hero); }
    .spectator-info .faction-witch { color: var(--witch); }
    .spectator-info .round-info    { color: var(--text-dim); }

    #spectate-status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-dim);
      font-size: 1.2rem;
      font-style: italic;
      z-index: 999;
    }

    /* Game-over overlay for spectators */
    #spectate-game-over {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1001;
      background: rgba(13, 15, 22, 0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }
    #spectate-game-over h2 {
      font-size: 1.8rem;
      color: var(--day);
      margin-bottom: 0.5rem;
    }
    #spectate-game-over p {
      color: var(--text);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Reuse the game screen structure from index.html (subset needed for rendering) -->
  <div id="setup-screen"></div>
  <div id="game-screen">
    <header id="game-header">
      <span class="header-title">BRIMSTONE</span>
      <div id="online-status" style="display:none"></div>
      <div id="turn-info"></div>
      <button id="end-turn-btn" style="display:none"></button>
      <div id="node-status"></div>
      <button id="inventory-btn" style="display:none"></button>
      <button id="chronicle-btn" class="header-icon-btn" title="Chronicle">📜</button>
      <span id="game-version" class="game-version"></span>
    </header>
    <div id="cycle-bar"><div id="node-status-bar"></div></div>

    <main id="game-main">
      <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="unit-stats-bar" style="display:none"></div>
        <div id="zoom-controls" class="zoom-controls">
          <button id="zoom-in"  class="zoom-btn" title="Zoom in">+</button>
          <button id="zoom-out" class="zoom-btn" title="Zoom out">-</button>
          <button id="zoom-fit" class="zoom-btn" title="Fit map">F</button>
        </div>
        <div id="chronicle-mini"></div>
      </div>

      <div id="plan-panel" style="display:none"></div>
    </main>

    <div id="cancel-wrap" style="display:none"></div>
  </div>

  <!-- Chronicle overlay -->
  <div id="chronicle-overlay">
    <div id="chronicle-panel">
      <div class="chronicle-header">
        <span class="chronicle-title">📜 Chronicle</span>
        <button id="chronicle-close">X</button>
      </div>
      <div id="event-log"></div>
    </div>
  </div>

  <!-- Dialogs needed by renderer (stubs) -->
  <div id="inventory-overlay" style="display:none"></div>
  <div id="tile-zoom-overlay" style="display:none"></div>
  <div id="action-popup" style="display:none"></div>
  <div id="encounter-dialog" style="display:none"></div>
  <div id="battle-toast-container" class="battle-toast-container"></div>
  <div id="result-dialog" style="display:none"></div>
  <div id="battle-dialog" style="display:none"></div>
  <div id="game-over" style="display:none"></div>
  <div id="speed-toggle" style="display:none"></div>

  <!-- Spectator UI -->
  <div class="spectator-banner">
    <span class="live-dot"></span>SPECTATING
  </div>

  <div class="spectator-info" id="spectator-info" style="display:none">
    <span class="faction-hero" id="sp-hero">-</span>
    <span class="round-info" id="sp-round">-</span>
    <span class="faction-witch" id="sp-witch">-</span>
  </div>

  <div id="spectate-status">Connecting...</div>

  <div id="spectate-game-over">
    <h2 id="sp-winner-text"></h2>
    <p id="sp-win-reason"></p>
  </div>

  <script type="module">
    import { Renderer }    from './src/renderer.js';
    import { MirrorState } from './src/multiplayer.js';
    import { VERSION }     from './src/version.js';

    const versionEl = document.getElementById('game-version');
    if (versionEl) versionEl.textContent = `v${VERSION}`;

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('room');
    const statusEl = document.getElementById('spectate-status');

    if (!roomId) {
      statusEl.textContent = 'No room specified. Use ?room=<roomId>';
    } else {
      connectSpectator(roomId);
    }

    let renderer = null;
    let currentState = null;

    function connectSpectator(roomId) {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}`);

      ws.addEventListener('open', () => {
        statusEl.textContent = 'Joining room...';
        ws.send(JSON.stringify({ type: 'adminSpectateRoom', roomId }));
      });

      ws.addEventListener('message', (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        statusEl.textContent = 'Disconnected.';
        statusEl.style.display = '';
      });

      ws.addEventListener('error', () => {
        statusEl.textContent = 'Connection error.';
      });
    }

    function handleMessage(msg) {
      switch (msg.type) {
        case 'adminSpectateInit': {
          statusEl.style.display = 'none';
          document.getElementById('spectator-info').style.display = '';
          const state = MirrorState.fromSnapshot(msg.state);
          initRenderer(state);
          updateInfo(msg.players, state);
          updateChronicle(state);
          break;
        }

        case 'stateUpdate': {
          const state = MirrorState.fromSnapshot(msg.state);
          updateState(state);
          break;
        }

        case 'resolutionComplete': {
          const state = MirrorState.fromSnapshot(msg.finalState);
          updateState(state);
          break;
        }

        case 'adminPlanningPhase': {
          const roundEl = document.getElementById('sp-round');
          roundEl.textContent = `Round ${msg.round} — ${msg.phase}`;
          break;
        }

        case 'adminRoomEnded': {
          statusEl.textContent = 'Game ended.';
          statusEl.style.display = '';
          break;
        }

        case 'error': {
          statusEl.textContent = msg.message || 'Error';
          statusEl.style.display = '';
          break;
        }
      }
    }

    function initRenderer(state) {
      currentState = state;
      const canvas = document.getElementById('game-canvas');
      renderer = new Renderer(canvas, state);
      renderer.resize();
      renderer.loadImages();

      // Wire up zoom controls
      document.getElementById('zoom-in')?.addEventListener('click', () => {
        renderer.zoomLevel = Math.min(4, renderer.zoomLevel * 1.3);
        renderer.draw();
      });
      document.getElementById('zoom-out')?.addEventListener('click', () => {
        renderer.zoomLevel = Math.max(0.5, renderer.zoomLevel / 1.3);
        renderer.draw();
      });
      document.getElementById('zoom-fit')?.addEventListener('click', () => {
        renderer.zoomLevel = 1;
        renderer._panX = 0;
        renderer._panY = 0;
        renderer.draw();
      });

      // Handle canvas drag for panning
      let dragging = false, lastX = 0, lastY = 0;
      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        renderer._panX += e.clientX - lastX;
        renderer._panY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        renderer.draw();
      });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });

      // Scroll wheel zoom
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        renderer.zoomLevel = Math.min(4, Math.max(0.5, renderer.zoomLevel * factor));
        renderer.draw();
      }, { passive: false });

      // Window resize
      window.addEventListener('resize', () => {
        renderer.resize();
        renderer.draw();
      });

      // Disable fog for spectators — show full map
      state.fogOfWar = false;
      renderer.draw();
    }

    function updateState(state) {
      // Disable fog for spectators
      state.fogOfWar = false;
      currentState = state;

      if (renderer) {
        renderer.state = state;
        renderer.draw();
      }

      updateChronicle(state);

      // Update info bar
      const roundEl = document.getElementById('sp-round');
      roundEl.textContent = `Round ${state.round} — ${state.phase}`;

      // Check game over
      if (state.gameOver) {
        const goEl = document.getElementById('spectate-game-over');
        const winText = document.getElementById('sp-winner-text');
        const reasonText = document.getElementById('sp-win-reason');
        const winner = state.winner;
        winText.textContent = winner === 'hero' ? 'Hero Wins!' : 'Witch Wins!';
        winText.style.color = winner === 'hero' ? 'var(--hero)' : 'var(--witch)';
        reasonText.textContent = state.winReason || '';
        goEl.style.display = '';
      }
    }

    function updateInfo(players, state) {
      if (players) {
        const heroPlayers = players.filter(p => p.faction === 'hero');
        const witchPlayers = players.filter(p => p.faction === 'witch');

        const heroNames = heroPlayers.map(p => p.name + (p.isAI ? ' (AI)' : '')).join(', ');
        const witchNames = witchPlayers.map(p => p.name + (p.isAI ? ' (AI)' : '')).join(', ');

        document.getElementById('sp-hero').textContent = `⚔ ${heroNames || 'Hero'}`;
        document.getElementById('sp-witch').textContent = `✦ ${witchNames || 'Witch'}`;
      }
      document.getElementById('sp-round').textContent = `Round ${state.round} — ${state.phase}`;
    }

    function updateChronicle(state) {
      // Update the mini chronicle with last few log entries
      const mini = document.getElementById('chronicle-mini');
      if (mini && state.log) {
        const recent = state.log.slice(-5);
        mini.innerHTML = recent.map(msg =>
          `<div class="chronicle-mini-line">${escapeHtml(msg)}</div>`
        ).join('');
      }

      // Update full chronicle overlay
      const logEl = document.getElementById('event-log');
      if (logEl && state.log) {
        logEl.innerHTML = state.log.map(msg =>
          `<div class="log-entry">${escapeHtml(msg)}</div>`
        ).join('');
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    function escapeHtml(str) {
      const el = document.createElement('span');
      el.textContent = str;
      return el.innerHTML;
    }

    // Wire up chronicle overlay toggle
    document.getElementById('chronicle-btn')?.addEventListener('click', () => {
      const overlay = document.getElementById('chronicle-overlay');
      overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
    });
    document.getElementById('chronicle-close')?.addEventListener('click', () => {
      document.getElementById('chronicle-overlay').style.display = 'none';
    });
  </script>
</body>
</html>
