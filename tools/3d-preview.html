<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brimstone — 3D Renderer Preview</title>
  <!--
    Standalone preview for src/renderer-3d.js.

    Loads the minimum needed to drive the 3D renderer with no game UI,
    lobby, or auth:  GameState (so the renderer has a state it can read),
    the map generator (so we can rebuild the scene from a seed), and
    Renderer3D itself.

    Served at http://localhost:3000/tools/3d-preview.html when `npm run dev`
    is running.  Forces  brimstone:renderer = '3d'  so the renderer pick in
    main.js — if you ever navigate back to the main app — stays on 3D.
  -->
  <style>
    :root {
      --bg-0:    #0b0810;
      --bg-1:    #15101e;
      --fg:      #e8ddc8;
      --accent:  #9b59b6;
      --border:  #2a2236;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: var(--bg-0);
      color: var(--fg);
      font: 14px/1.4 Georgia, serif;
      overflow: hidden;
    }
    body {
      display: flex; flex-direction: column;
    }
    #controls {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 14px;
      padding: 8px 14px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--border);
    }
    #controls label { opacity: 0.85; }
    #controls input, #controls select, #controls button {
      background: #221a2e; color: var(--fg);
      border: 1px solid var(--border);
      padding: 4px 8px; font: inherit;
      border-radius: 3px;
    }
    #controls input[type=number] { width: 8em; }
    #controls button {
      background: var(--accent); color: #fff; border-color: var(--accent);
      cursor: pointer;
    }
    #controls button:hover { filter: brightness(1.15); }
    #controls .spacer { flex: 1 1 auto; }
    #controls .status { opacity: 0.7; font-size: 12px; }

    #stage {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
    }
    #stage canvas {
      display: block;
      width: 100%; height: 100%;
    }
    #boot-msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      color: rgba(232,221,200,0.5);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label>seed
      <input id="seed" type="number" value="42" />
    </label>
    <label>size
      <select id="size">
        <option value="skirmish">skirmish</option>
        <option value="standard" selected>standard</option>
        <option value="regional">regional</option>
        <option value="campaign">campaign</option>
      </select>
    </label>
    <button id="regen">regenerate</button>
    <button id="random-seed" title="Pick a fresh random seed and regenerate">random</button>
    <div class="spacer"></div>
    <div class="status" id="status">booting…</div>
  </div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="boot-msg">loading Babylon from CDN — first paint may take a moment…</div>
  </div>

  <script type="module">
    // Persist 3D preference so re-entering the main app stays on 3D.
    try { localStorage.setItem('brimstone:renderer', '3d'); } catch { /* private mode */ }

    import { GameState }   from '../src/game.js';
    import { generateMap } from '../src/map.js';
    import { Renderer3D }  from '../src/renderer-3d.js';

    const canvas    = document.getElementById('canvas');
    const seedInput = document.getElementById('seed');
    const sizeSel   = document.getElementById('size');
    const regenBtn  = document.getElementById('regen');
    const randBtn   = document.getElementById('random-seed');
    const statusEl  = document.getElementById('status');
    const bootMsg   = document.getElementById('boot-msg');

    let renderer = null;
    let state    = null;

    function setStatus(msg) { statusEl.textContent = msg; }

    function rebuildScene() {
      const seed = parseInt(seedInput.value, 10);
      const size = sizeSel.value;
      if (!Number.isFinite(seed)) { setStatus('invalid seed'); return; }

      setStatus(`generating ${size} seed=${seed}…`);

      // Pre-generate the map with the chosen seed so GameState uses it
      // instead of rolling its own.
      const mapData = generateMap(seed, size);

      // Dispose any prior renderer's Babylon engine before we drop the ref,
      // so we don't leak the WebGL context on each regenerate.
      if (renderer && renderer._engine) {
        try { renderer._engine.dispose(); } catch { /* phase 1 stub may not own resources */ }
      }

      state    = new GameState(true, true, size, null, mapData);
      renderer = new Renderer3D(canvas, state);

      // Match canvas backing buffer to its CSS size before the first draw.
      renderer.resize();
      // Kick off the tilemap atlas load. Without this, `_tilemapImg` stays
      // null forever, so `_buildTileTopDisc` returns null for every tile and
      // no textured top-disc is ever attached — the map renders as plain
      // coloured cylinders, exactly the symptom operators reported when
      // playtesting via this preview tool. main.js's renderer setup calls
      // loadImages() for the same reason; the preview tool is the only
      // Renderer3D consumer that was missing the call. Async — Babylon's
      // continuous render loop picks up the textured discs on the next
      // frame after `_upgradeTileTextures()` retro-fits them when the atlas
      // resolves. No await needed.
      renderer.loadImages();
      renderer.draw();
      bootMsg.style.display = 'none';
      setStatus(`rendering · ${size} · seed ${seed}`);
    }

    // Hook up controls.
    regenBtn.addEventListener('click', rebuildScene);
    seedInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') rebuildScene(); });
    sizeSel.addEventListener('change', rebuildScene);
    randBtn.addEventListener('click', () => {
      seedInput.value = Math.floor(Math.random() * 0x7fffffff);
      rebuildScene();
    });

    // Resize the WebGL canvas with the window.
    window.addEventListener('resize', () => {
      if (renderer) renderer.resize();
    });

    // Initial render.
    rebuildScene();
  </script>
</body>
</html>
