name: itch.io Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build itch.io zip
        run: node scripts/build-itch.js dist/calebs-hollow-itch.zip

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        run: gh release upload "${{ github.ref_name }}" dist/calebs-hollow-itch.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calebs-hollow-itch
          path: dist/calebs-hollow-itch.zip
