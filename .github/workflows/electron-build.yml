name: Electron Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write   # needed to publish to GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Apple API key for notarization
        if: matrix.platform == 'mac'
        run: |
          mkdir -p $HOME/private_keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > $HOME/private_keys/AuthKey_$APPLE_API_KEY.p8
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - name: Debug signing setup
        if: matrix.platform == 'mac'
        run: |
          echo "CSC_LINK length: ${#CSC_LINK}"
          echo "CSC_KEY_PASSWORD set: $( [ -n "$CSC_KEY_PASSWORD" ] && echo yes || echo no )"
          echo "API key file exists: $(ls -la $HOME/private_keys/ 2>&1)"
          security find-identity -v -p codesigning
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}

      - name: Build, sign, notarize, and publish (macOS)
        if: matrix.platform == 'mac'
        run: npm run electron:build:mac -- --publish ${{ (github.ref_type == 'tag' || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: /Users/runner/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: npm run electron:build:win -- --publish ${{ (github.ref_type == 'tag' || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional — set these secrets to enable):
          # WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
