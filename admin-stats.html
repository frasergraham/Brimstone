<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brimstone — Game Stats</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f16;
      --bg-panel:    #111520;
      --bg-section:  #161b28;
      --border:      #2a2040;
      --text:        #d4c9b0;
      --text-dim:    #7a7060;
      --text-bright: #f0e8d0;
      --hero:        #d4a72c;
      --witch:       #9b59b6;
      --day:         #f5c842;
      --night:       #7b4fbb;
      --green:       #4caf7d;
      --red:         #c0392b;
      --font-serif:  "Georgia", "Times New Roman", serif;
      --font-mono:   "Courier New", monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.5;
      overflow-y: auto;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 2rem 3rem;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: var(--day);
      text-shadow: 0 0 16px rgba(245,200,66,0.3);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-dim);
      font-style: italic;
      margin-bottom: 1.5rem;
    }

    a { color: var(--hero); }
    a:hover { color: var(--day); }

    /* ── Cards ──────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      text-align: center;
    }

    .card .value {
      font-size: 2rem;
      font-weight: bold;
      color: var(--text-bright);
      font-family: var(--font-mono);
    }

    .card .label {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .card.hero .value  { color: var(--hero); }
    .card.witch .value { color: var(--witch); }
    .card.green .value { color: var(--green); }

    /* ── Sections ──────────────────────────── */
    .section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .section h2 {
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      color: var(--day);
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    /* ── Tables ──────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.4rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-dim);
      font-weight: normal;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    td { color: var(--text); }

    /* ── Bar chart ──────────────────────── */
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .bar-label {
      width: 120px;
      font-size: 0.85rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 0.75rem;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .bar-value {
      width: 50px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-bright);
    }

    .balance-meter {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .balance-meter .track {
      flex: 1;
      height: 24px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .balance-meter .hero-fill {
      background: var(--hero);
      transition: width 0.6s ease;
    }

    .balance-meter .witch-fill {
      background: var(--witch);
      transition: width 0.6s ease;
    }

    .balance-meter .side-label {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: bold;
      min-width: 60px;
    }

    .balance-meter .side-label.hero  { color: var(--hero); text-align: right; }
    .balance-meter .side-label.witch { color: var(--witch); text-align: left; }

    .health-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: bold;
    }

    .health-badge.good    { background: #1a3a20; color: var(--green); }
    .health-badge.warning { background: #3a3010; color: #e0c030; }
    .health-badge.bad     { background: #3a1515; color: var(--red); }

    .note {
      color: var(--text-dim);
      font-size: 0.8rem;
      font-style: italic;
      margin-top: 0.5rem;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      font-style: italic;
      padding: 3rem 1rem;
    }

    .recent-games {
      max-height: 400px;
      overflow-y: auto;
    }

    .refresh-btn {
      background: var(--bg-section);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.85rem;
      float: right;
    }

    .refresh-btn:hover {
      border-color: var(--hero);
      color: var(--text-bright);
    }

    /* ── Mobile ──────────────────────────── */
    @media (max-width: 600px) {
      .wrap { padding: 1rem 0.75rem 2rem; }
      h1 { font-size: 1.4rem; letter-spacing: 0.1em; }
      .refresh-btn { float: none; display: block; margin: 0 0 0.75rem auto; }
      .cards { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.75rem; }
      .card { padding: 0.75rem; }
      .card .value { font-size: 1.5rem; }
      .section { padding: 0.75rem 1rem; overflow-x: auto; }
      .bar-label { width: 80px; font-size: 0.78rem; }
      .bar-value { width: 45px; font-size: 0.78rem; }
      .bar-track { margin: 0 0.4rem; }
      .balance-meter { gap: 0.4rem; }
      .balance-meter .side-label { min-width: 38px; font-size: 0.78rem; }
      th, td { padding: 0.3rem 0.5rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="refresh-btn" onclick="load()">Refresh</button>
    <h1>BRIMSTONE</h1>
    <p class="subtitle">Game Statistics &amp; Balance Analysis &mdash; <a href="/admin" class="admin-nav-link">Admin Panel</a></p>

    <div id="content">
      <p class="empty-state">Loading stats...</p>
    </div>
  </div>

  <script>
    // ── Auth gate ────────────────────────────────────────────────────────────────

    const _session = JSON.parse(localStorage.getItem('brimstone_session') || 'null');
    const _token = _session?.token;

    (async () => {
      if (!_token) { window.location.href = '/'; return; }
      try {
        const r = await fetch(`/api/me/admin?token=${encodeURIComponent(_token)}`);
        if (!r.ok) { window.location.href = '/'; return; }
        const data = await r.json();
        if (!data.isAdmin) { window.location.href = '/'; return; }
      } catch { window.location.href = '/'; }
    })();

    async function load() {
      try {
        const sep = _token ? `?token=${encodeURIComponent(_token)}` : '';
        const [res, campRes] = await Promise.all([
          fetch(`/admin/api/game-stats/summary${sep}`),
          fetch(`/admin/api/campaign-game-stats/summary${sep}`).catch(() => null)
        ]);
        if (res.status === 401 || res.status === 403) { window.location.href = '/'; return; }
        const data = await res.json();
        const campData = campRes && campRes.ok ? await campRes.json() : null;
        render(data, campData);
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<p class="empty-state">Failed to load stats: ${err.message}</p>`;
      }
    }

    function pct(n, total) {
      return total > 0 ? (n / total * 100).toFixed(1) : '0.0';
    }

    function balanceBadge(heroWinPct) {
      if (heroWinPct >= 45 && heroWinPct <= 55) return '<span class="health-badge good">Balanced</span>';
      if (heroWinPct >= 40 && heroWinPct <= 60) return '<span class="health-badge warning">Slightly skewed</span>';
      return '<span class="health-badge bad">Imbalanced</span>';
    }

    function roundsBadge(avg) {
      if (avg >= 15 && avg <= 25) return '<span class="health-badge good">Healthy</span>';
      if (avg >= 10 && avg <= 30) return '<span class="health-badge warning">Acceptable</span>';
      return '<span class="health-badge bad">Out of range</span>';
    }

    function fmtDuration(ms) {
      if (!ms) return '--';
      const s = Math.round(ms / 1000);
      const m = Math.floor(s / 60);
      return m > 0 ? `${m}m ${s % 60}s` : `${s}s`;
    }

    function winRateBadge(winPct) {
      if (winPct >= 30 && winPct <= 70) return '<span class="health-badge good">Normal</span>';
      if (winPct >= 15 && winPct <= 85) return '<span class="health-badge warning">Skewed</span>';
      return '<span class="health-badge bad">Extreme</span>';
    }

    function render(d, campData) {
      if (d.totalGames === 0) {
        document.getElementById('content').innerHTML =
          '<p class="empty-state">No games recorded yet. Play some games to see stats!</p>';
        return;
      }

      let html = '';

      // ── Summary cards ──
      html += '<div class="cards">';
      html += card(d.totalGames, 'Total Games');
      html += card(d.heroWins, 'Hero Wins', 'hero');
      html += card(d.witchWins, 'Witch Wins', 'witch');
      html += card(d.avgRounds, 'Avg Rounds', 'green');
      html += card(d.avgHeroKills, 'Avg Hero Kills', 'hero');
      html += card(d.avgWitchKills, 'Avg Witch Kills', 'witch');
      html += '</div>';

      // ── Balance Meter ──
      html += '<div class="section">';
      html += '<h2>Faction Balance</h2>';
      html += `<div class="balance-meter">`;
      html += `<span class="side-label hero">${d.heroWinPct}%</span>`;
      html += `<div class="track">`;
      html += `<div class="hero-fill" style="width:${d.heroWinPct}%"></div>`;
      html += `<div class="witch-fill" style="width:${d.witchWinPct}%"></div>`;
      html += `</div>`;
      html += `<span class="side-label witch">${d.witchWinPct}%</span>`;
      html += `</div>`;
      html += `<p class="note">Target: 45-55% hero win rate. Current: ${balanceBadge(d.heroWinPct)}</p>`;
      html += '</div>';

      // ── Game Length ──
      html += '<div class="section">';
      html += '<h2>Game Length</h2>';
      html += `<p>Average: <strong>${d.avgRounds}</strong> rounds (min ${d.minRounds}, max ${d.maxRounds}) ${roundsBadge(d.avgRounds)}</p>`;
      html += '<p class="note">Target: 15-25 rounds per game.</p>';
      html += '</div>';

      // ── Win Reasons ──
      html += '<div class="section">';
      html += '<h2>Win Conditions</h2>';
      const maxReasonCount = Math.max(...d.byWinReason.map(r => r.count), 1);
      for (const row of d.byWinReason) {
        const p = pct(row.count, d.totalGames);
        const color = row.win_reason.includes('hero') || row.win_reason.includes('HERO')
          ? 'var(--hero)' : 'var(--witch)';
        html += barRow(row.win_reason, row.count, maxReasonCount, color, `${p}%`);
      }
      const killWins = d.byWinReason
        .filter(r => r.win_reason.includes('slain') || r.win_reason.includes('SLAIN'))
        .reduce((s, r) => s + r.count, 0);
      const killShare = pct(killWins, d.totalGames);
      html += `<p class="note">Kill-win share: ${killShare}% (target: 40-60%)</p>`;
      html += '</div>';

      // ── Map Sizes ──
      html += '<div class="section">';
      html += '<h2>Map Sizes</h2>';
      const maxMapCount = Math.max(...d.byMapSize.map(r => r.count), 1);
      for (const row of d.byMapSize) {
        html += barRow(row.map_size, row.count, maxMapCount, 'var(--green)', `${pct(row.count, d.totalGames)}%`);
      }
      html += '</div>';

      // ── Game Mode ──
      html += '<div class="section">';
      html += '<h2>Game Mode</h2>';
      const maxModeCount = Math.max(...d.byMode.map(r => r.count), 1);
      for (const row of d.byMode) {
        html += barRow(row.mode, row.count, maxModeCount, 'var(--day)', `${pct(row.count, d.totalGames)}%`);
      }
      html += '</div>';

      // ── Unit Economy ──
      html += '<div class="section">';
      html += '<h2>Unit Economy (averages)</h2>';
      html += '<table><tr><th>Metric</th><th>Value</th></tr>';
      html += `<tr><td>Hero kills per game</td><td style="color:var(--hero)">${d.avgHeroKills}</td></tr>`;
      html += `<tr><td>Witch kills per game</td><td style="color:var(--witch)">${d.avgWitchKills}</td></tr>`;
      html += `<tr><td>Survivors recruited per game</td><td style="color:var(--green)">${d.avgHeroSurvivors}</td></tr>`;
      html += `<tr><td>Witch summons per game</td><td style="color:var(--witch)">${d.avgWitchSummons}</td></tr>`;
      html += '</table></div>';

      // ── Version Breakdown ──
      if (d.byVersion.length > 0) {
        html += '<div class="section">';
        html += '<h2>Stats by Version</h2>';
        html += '<table><tr><th>Version</th><th>Games</th><th>Hero Wins</th><th>Witch Wins</th><th>Hero %</th><th>Avg Rounds</th></tr>';
        for (const v of d.byVersion) {
          const vPct = pct(v.hero_wins, v.count);
          html += `<tr>`;
          html += `<td>${v.game_version}</td>`;
          html += `<td>${v.count}</td>`;
          html += `<td style="color:var(--hero)">${v.hero_wins}</td>`;
          html += `<td style="color:var(--witch)">${v.witch_wins}</td>`;
          html += `<td>${vPct}% ${balanceBadge(parseFloat(vPct))}</td>`;
          html += `<td>${v.avg_rounds}</td>`;
          html += `</tr>`;
        }
        html += '</table></div>';
      }

      // ── Personality Matchups ──
      if (d.byPersonality.length > 0) {
        html += '<div class="section">';
        html += '<h2>AI Personality Matchups</h2>';
        html += '<table><tr><th>Hero</th><th>Witch</th><th>Games</th><th>Hero Wins</th><th>Witch Wins</th><th>Hero %</th></tr>';
        for (const m of d.byPersonality) {
          const mPct = pct(m.hero_wins, m.count);
          html += `<tr>`;
          html += `<td style="color:var(--hero)">${m.hero_personality}</td>`;
          html += `<td style="color:var(--witch)">${m.witch_personality}</td>`;
          html += `<td>${m.count}</td>`;
          html += `<td>${m.hero_wins}</td>`;
          html += `<td>${m.witch_wins}</td>`;
          html += `<td>${mPct}% ${balanceBadge(parseFloat(mPct))}</td>`;
          html += `</tr>`;
        }
        html += '</table></div>';
      }

      // ── Campaign Stats ──
      if (campData && campData.totalAttempts > 0) {
        html += renderCampaign(campData);
      }

      document.getElementById('content').innerHTML = html;
    }

    function renderCampaign(d) {
      const totalWins = d.byMission.reduce((s, m) => s + m.wins, 0);
      const totalLosses = d.byMission.reduce((s, m) => s + m.losses, 0);

      let html = '<hr style="border:none;border-top:2px solid var(--border);margin:2.5rem 0 2rem">';
      html += '<h2 style="font-size:1.4rem;letter-spacing:0.15em;color:var(--night);margin-bottom:1.5rem">CAMPAIGN STATS</h2>';

      // ── Summary cards ──
      html += '<div class="cards">';
      html += card(d.totalAttempts, 'Campaign Attempts');
      html += card(totalWins, 'Victories', 'hero');
      html += card(totalLosses, 'Defeats', 'witch');
      html += card(d.avgRounds, 'Avg Rounds', 'green');
      html += card(d.avgHeroKills, 'Avg Kills', 'hero');
      html += card(d.avgSurvivorsLost, 'Avg Survivors Lost');
      html += '</div>';

      // ── Win/Loss Balance ──
      const heroWinPct = parseFloat(pct(totalWins, d.totalAttempts));
      const witchWinPct = parseFloat(pct(totalLosses, d.totalAttempts));
      html += '<div class="section">';
      html += '<h2>Campaign Win Rate</h2>';
      html += '<div class="balance-meter">';
      html += `<span class="side-label hero">${heroWinPct}%</span>`;
      html += '<div class="track">';
      html += `<div class="hero-fill" style="width:${heroWinPct}%"></div>`;
      html += `<div class="witch-fill" style="width:${witchWinPct}%"></div>`;
      html += '</div>';
      html += `<span class="side-label witch">${witchWinPct}%</span>`;
      html += '</div>';
      html += `<p class="note">Hero victory rate across all campaign missions. ${winRateBadge(heroWinPct)}</p>`;
      html += '</div>';

      // ── Per-Mission Breakdown ──
      if (d.byMission.length > 0) {
        html += '<div class="section">';
        html += '<h2>Mission Breakdown</h2>';
        html += '<table><tr><th>Mission</th><th>Attempts</th><th>Wins</th><th>Losses</th><th>Win %</th><th>Avg Rounds</th><th>Avg Kills</th><th>Avg Lost</th><th>Avg Duration</th></tr>';
        for (const m of d.byMission) {
          const wp = pct(m.wins, m.attempts);
          html += '<tr>';
          html += `<td>${m.mission_title || m.mission_id}</td>`;
          html += `<td>${m.attempts}</td>`;
          html += `<td style="color:var(--hero)">${m.wins}</td>`;
          html += `<td style="color:var(--witch)">${m.losses}</td>`;
          html += `<td>${wp}% ${winRateBadge(parseFloat(wp))}</td>`;
          html += `<td>${m.avg_rounds}</td>`;
          html += `<td style="color:var(--hero)">${m.avg_hero_kills}</td>`;
          html += `<td style="color:var(--red)">${m.avg_survivors_lost}</td>`;
          html += `<td>${fmtDuration(m.avg_duration_ms)}</td>`;
          html += '</tr>';
        }
        html += '</table></div>';
      }

      // ── Win Reasons ──
      if (d.byWinReason.length > 0) {
        html += '<div class="section">';
        html += '<h2>Campaign Win Conditions</h2>';
        const maxRC = Math.max(...d.byWinReason.map(r => r.count), 1);
        for (const row of d.byWinReason) {
          const p = pct(row.count, d.totalAttempts);
          const color = row.win_reason.toLowerCase().includes('hero') ? 'var(--hero)' : 'var(--witch)';
          html += barRow(row.win_reason, row.count, maxRC, color, `${p}%`);
        }
        html += '</div>';
      }

      // ── Campaign Sessions ──
      if (d.byCampaign.length > 0) {
        html += '<div class="section">';
        html += '<h2>Campaign Sessions</h2>';
        html += '<table><tr><th>Campaign ID</th><th>Attempts</th><th>Wins</th><th>Losses</th><th>Missions Tried</th></tr>';
        for (const c of d.byCampaign) {
          html += '<tr>';
          html += `<td>${c.campaign_id}</td>`;
          html += `<td>${c.total_attempts}</td>`;
          html += `<td style="color:var(--hero)">${c.total_wins}</td>`;
          html += `<td style="color:var(--witch)">${c.total_losses}</td>`;
          html += `<td>${c.missions_attempted}</td>`;
          html += '</tr>';
        }
        html += '</table></div>';
      }

      // ── Unit Economy ──
      html += '<div class="section">';
      html += '<h2>Campaign Unit Economy (averages)</h2>';
      html += '<table><tr><th>Metric</th><th>Value</th></tr>';
      html += `<tr><td>Hero kills per mission</td><td style="color:var(--hero)">${d.avgHeroKills}</td></tr>`;
      html += `<tr><td>Witch kills per mission</td><td style="color:var(--witch)">${d.avgWitchKills}</td></tr>`;
      html += `<tr><td>Survivors deployed per mission</td><td style="color:var(--green)">${d.avgSurvivorsDeployed}</td></tr>`;
      html += `<tr><td>Survivors lost per mission</td><td style="color:var(--red)">${d.avgSurvivorsLost}</td></tr>`;
      html += `<tr><td>Enemies spawned per mission</td><td style="color:var(--witch)">${d.avgEnemiesSpawned}</td></tr>`;
      html += '</table></div>';

      // ── Recent Games ──
      if (d.recentGames && d.recentGames.length > 0) {
        html += '<div class="section">';
        html += '<h2>Recent Campaign Games</h2>';
        html += '<div class="recent-games">';
        html += '<table><tr><th>Mission</th><th>Winner</th><th>Reason</th><th>Rounds</th><th>Kills</th><th>Survivors</th><th>Duration</th><th>Date</th></tr>';
        for (const g of d.recentGames) {
          const date = g.created_at ? new Date(g.created_at * 1000).toLocaleDateString() : '--';
          const winColor = g.winner === 'hero' ? 'var(--hero)' : 'var(--witch)';
          html += '<tr>';
          html += `<td>${g.mission_title || g.mission_id}</td>`;
          html += `<td style="color:${winColor}">${g.winner}</td>`;
          html += `<td>${g.win_reason}</td>`;
          html += `<td>${g.rounds}</td>`;
          html += `<td>${g.hero_kills}</td>`;
          html += `<td>${g.survivors_deployed - g.survivors_lost}/${g.survivors_deployed}</td>`;
          html += `<td>${fmtDuration(g.duration_ms)}</td>`;
          html += `<td>${date}</td>`;
          html += '</tr>';
        }
        html += '</table></div></div>';
      }

      return html;
    }

    function card(value, label, cls = '') {
      return `<div class="card ${cls}"><div class="value">${value}</div><div class="label">${label}</div></div>`;
    }

    function barRow(label, count, max, color, suffix) {
      const w = max > 0 ? (count / max * 100) : 0;
      return `<div class="bar-row">
        <span class="bar-label">${label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
        <span class="bar-value">${count} (${suffix})</span>
      </div>`;
    }

    load();
  </script>
</body>
</html>
