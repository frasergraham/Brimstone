appId: com.brimstone.game
productName: Brimstone

directories:
  output: dist

# Only include client-side game files — server code and native modules are
# excluded since the Electron app is a pure client that connects to a remote
# server for multiplayer.
files:
  - "**/*"
  - "!dist/**"
  - "!.git/**"
  - "!.github/**"
  - "!tests/**"
  - "!scripts/**"
  - "!server/**"
  - "!server.js"
  - "!data/**"
  - "!*.md"
  - "!CLAUDE.md"
  - "!CHANGELOG.json"
  - "!node_modules/better-sqlite3/**"
  - "!node_modules/canvas/**"
  - "!node_modules/@anthropic-ai/**"
  - "!node_modules/express/**"
  - "!node_modules/ws/**"
  - "!node_modules/undici/**"
  - "!node_modules/https-proxy-agent/**"
  - "!node_modules/sharp/**"

mac:
  category: public.app-category.games
  target:
    - dmg
    - zip   # required for electron-updater differential downloads
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - AppImage
  category: Game

publish:
  provider: github
  owner: frasergraham
  repo: brimstone
