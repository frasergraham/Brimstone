appId: com.calebshollow.game
productName: "Caleb's Hollow"

directories:
  output: dist

# Only include client-side game files — server code and native modules are
# excluded since the Electron app is a pure client that connects to a remote
# server for multiplayer.
files:
  - filter:
      - "**/*"
      - "!dist/**"
      - "!.git/**"
      - "!.github/**"
      - "!tests/**"
      - "!scripts/**"
      - "!server/**"
      - "!server.js"
      - "!data/**"
      - "!*.md"
      - "!CLAUDE.md"
      - "!CHANGELOG.json"
      - "!node_modules/better-sqlite3/**"
      - "!node_modules/canvas/**"
      - "!node_modules/@anthropic-ai/**"
      - "!node_modules/express/**"
      - "!node_modules/ws/**"
      - "!node_modules/undici/**"
      - "!node_modules/https-proxy-agent/**"
      - "!node_modules/sharp/**"
      - "!assets/generated/**"
      # Editable source-art working files (Pixelmator .pxd etc.) — large and
      # never loaded at runtime; keep them out of the packaged app.
      - "!**/*.pxd"
  - "server/resolver.js"
  - "server/state-sync.js"

afterPack: ./scripts/electron-afterpack.js

mac:
  category: public.app-category.games
  target:
    - dmg
    - zip   # required for electron-updater differential downloads
  notarize: true

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - AppImage
  category: Game

publish:
  provider: github
  owner: frasergraham
  repo: brimstone
